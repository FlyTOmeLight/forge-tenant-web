image:
  repository: forge-tenant-web
  tag: dev
  pullPolicy: IfNotPresent
replicas: 1
api:
  upstream: http://forge-tenant
resources:
  requests: {cpu: 25m, memory: 32Mi}
  limits: {memory: 128Mi}
ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecret: ""

coding:
  upstream: http://forge-coding

# Optional metadata APIs. Empty values keep the reserved paths closed (404).
artifact:
  upstream: ""
storage:
  upstream: ""

# Optional ConfigMap containing ca-certificates.crt (system roots plus private CAs).
trustBundleConfigMap: ""
