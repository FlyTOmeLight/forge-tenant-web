fullnameOverride: ""

image:
  repository: forge-tenant-web
  tag: dev
  pullPolicy: IfNotPresent
replicas: 1
api:
  upstream: http://forge-tenant
resources:
  requests: {cpu: 25m, memory: 32Mi}
  limits: {memory: 128Mi}
ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecret: ""

# Disabling a feature closes its API proxy and frontend routes/navigation.
coding:
  enabled: true
  upstream: http://forge-coding

agent:
  enabled: false
  upstream: http://agentic-kit-api

# Optional metadata APIs. Empty values keep the reserved paths closed (404).
artifact:
  upstream: ""
storage:
  upstream: ""

# Optional ConfigMap containing ca-certificates.crt (system roots plus private CAs).
trustBundleConfigMap: ""
