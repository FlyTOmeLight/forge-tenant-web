{{- range $name := list "artifact" "storage" }}
{{- $upstream := index $.Values $name "upstream" }}
{{- if and $upstream (not (regexMatch "^https?://[A-Za-z0-9][A-Za-z0-9.-]*(:[0-9]{1,5})?/?$" $upstream)) }}
{{- fail (printf "%s.upstream must be an HTTP(S) origin with a DNS name or IPv4 host and optional port" $name) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-nginx
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header Cache-Control no-store always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
      access_log off;
      location = /healthz { access_log off; return 200 'ok'; }
      location ^~ /internal/ { return 404; }
      # Only the public v1 namespaces are forwarded; every other reserved path fails closed.
      {{- range $name := list "artifact" "storage" }}
      location = /{{ $name }} { return 404; }
      location ^~ /{{ $name }}/v1/ {
        {{- $upstream := index $.Values $name "upstream" }}
        {{- if $upstream }}
        client_max_body_size 8m;
        proxy_pass {{ trimSuffix "/" $upstream }}/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_read_timeout 60s;
        {{- else }}
        return 404;
        {{- end }}
      }
      location ^~ /{{ $name }}/ { return 404; }
      {{- end }}
      location ~ ^/api/v1/(tenants/[^/]+/projects/[^/]+/(tasks|coding-settings)(/|$)|platform/connections$) {
        proxy_pass {{ required "coding.upstream is required" .Values.coding.upstream }};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
      }
      location ~ ^/(api|auth)/ {
        proxy_pass {{ required "api.upstream is required" .Values.api.upstream }};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 3600s;
      }
      location /assets/ { try_files $uri =404; }
      location / { try_files $uri /index.html; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
      annotations:
        forge/upstream: {{ .Values.api.upstream | quote }}
        forge/coding-upstream: {{ .Values.coding.upstream | quote }}
        forge/artifact-upstream: {{ .Values.artifact.upstream | quote }}
        forge/storage-upstream: {{ .Values.storage.upstream | quote }}
        forge/trust-bundle-config-map: {{ .Values.trustBundleConfigMap | default "" | quote }}
        forge/config-revision: {{ .Values.configRevision | default "initial" | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101}
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [nginx, -g, "daemon off;"]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}}
          resources: {{ toJson .Values.resources }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: nginx, mountPath: /etc/nginx/conf.d, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.trustBundleConfigMap }}
            - {name: trust-bundle, mountPath: /etc/ssl/certs/ca-certificates.crt, subPath: ca-certificates.crt, readOnly: true}
            {{- end }}
      volumes:
        - name: nginx
          configMap: {name: {{ .Release.Name }}-nginx}
        - name: tmp
          emptyDir: {}
        {{- if .Values.trustBundleConfigMap }}
        - name: trust-bundle
          configMap: {name: {{ .Values.trustBundleConfigMap | quote }}}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  selector: {app: {{ .Release.Name }}}
  ports: [{port: 80, targetPort: 8080}]
