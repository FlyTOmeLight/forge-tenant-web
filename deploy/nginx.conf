server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 add_header Cache-Control no-store always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
 # Tokens may appear in authorization callback query strings; exclude queries from logs.
 access_log off;
 location = /healthz { access_log off; return 200 'ok'; }
 location ^~ /internal/ { return 404; }
 location ~ ^/api/v1/(tenants/[^/]+/projects/[^/]+/(tasks|coding-settings)(/|$)|platform/connections$) {
  proxy_pass http://forge-coding;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_buffering off;
  proxy_read_timeout 3600s;
 }
 location ~ ^/(api|auth)/ {
  proxy_pass http://forge-tenant;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_buffering off;
  proxy_read_timeout 3600s;
 }
 location /assets/ { try_files $uri =404; }
 location / { try_files $uri /index.html; }
}
