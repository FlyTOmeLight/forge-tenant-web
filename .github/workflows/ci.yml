name: Web checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm audit --audit-level=high
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: helm lint charts/forge-tenant-web
      - run: docker build -t forge-tenant-web:ci .
